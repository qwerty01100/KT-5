<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Банковская карта</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
 
  <div class="container">
    <h1>Добавить банковскую карту</h1>
 
    <div class="top-section">
 
      <!-- ФОРМА -->
      <div class="form-panel">
        <form id="cardForm" novalidate>
 
          <div class="form-group">
            <label for="bank">Название банка</label>
            <select name="bank" id="bank">
              <option value="">— Выберите банк —</option>
              <option value="Сбербанк"    data-color="#21a038">Сбербанк</option>
              <option value="Тинькофф"   data-color="#ffdd2d">Тинькофф</option>
              <option value="ВТБ"         data-color="#002882">ВТБ</option>
              <option value="Альфа-Банк"  data-color="#ef3124">Альфа-Банк</option>
              <option value="Газпромбанк" data-color="#003087">Газпромбанк</option>
              <option value="Райффайзен"  data-color="#ffed00">Райффайзен</option>
              <option value="Другой"      data-color="#888888">Другой</option>
            </select>
          </div>
 
          <div class="form-group">
            <label for="payment">Тип платёжной системы</label>
            <select name="payment" id="payment">
              <option value="">— Выберите систему —</option>
              <option value="Visa">Visa</option>
              <option value="Mastercard">Mastercard</option>
              <option value="Мир">Мир</option>
              <option value="UnionPay">UnionPay</option>
            </select>
          </div>
 
          <div class="form-group">
            <label for="number">Номер карты (16 цифр)</label>
            <input type="text" name="number" id="number"
                   placeholder="0000 0000 0000 0000" maxlength="19" autocomplete="off">
          </div>
 
          <div class="form-group">
            <label for="holder">Имя держателя карты</label>
            <input type="text" name="holder" id="holder"
                   placeholder="IVAN PETROV">
          </div>
 
          <div class="expiry-row">
            <div class="form-group">
              <label for="month">Месяц окончания</label>
              <select name="month" id="month">
                <option value="">ММ</option>
                <option value="01">01 — Январь</option>
                <option value="02">02 — Февраль</option>
                <option value="03">03 — Март</option>
                <option value="04">04 — Апрель</option>
                <option value="05">05 — Май</option>
                <option value="06">06 — Июнь</option>
                <option value="07">07 — Июль</option>
                <option value="08">08 — Август</option>
                <option value="09">09 — Сентябрь</option>
                <option value="10">10 — Октябрь</option>
                <option value="11">11 — Ноябрь</option>
                <option value="12">12 — Декабрь</option>
              </select>
            </div>
            <div class="form-group">
              <label for="year">Год окончания</label>
              <select name="year" id="year">
                <option value="">ГГГГ</option>
                <option value="2025">2025</option>
                <option value="2026">2026</option>
                <option value="2027">2027</option>
                <option value="2028">2028</option>
                <option value="2029">2029</option>
                <option value="2030">2030</option>
                <option value="2031">2031</option>
                <option value="2032">2032</option>
                <option value="2033">2033</option>
              </select>
            </div>
          </div>
 
          <button type="submit" class="submit-btn">Сохранить карту</button>
 
        </form>
      </div>
 
      <div class="card-preview-panel">
        <div class="card" id="cardPreview">
 
          <div class="card-top">
            <div class="bank-logo-preview">
              <span class="bank-color-dot" id="bankDot"></span>
              <span id="bankName" class="placeholder-text">Банк</span>
            </div>
            <div class="payment-logo" id="paymentLogo">
              <span class="placeholder-text">Система</span>
            </div>
          </div>
 
          <div class="card-chip"></div>
 
          <div class="card-number-preview" id="cardNumber">
            <span class="placeholder-text">0000 0000 0000 0000</span>
          </div>
 
          <div class="card-bottom">
            <div>
              <div class="card-label">Держатель</div>
              <div class="card-value" id="cardHolder">
                <span class="placeholder-text">ИМЯ ФАМИЛИЯ</span>
              </div>
            </div>
            <div>
              <div class="card-label">Срок действия</div>
              <div class="card-value" id="cardExpiry">
                <span class="placeholder-text">ММ / ГГГГ</span>
              </div>
            </div>
          </div>
 
        </div>
      </div>
 
    </div>
    <div class="table-section">
      <h2>Сохранённые карты</h2>
      <table class="cards-table">
        <thead>
          <tr>
            <th>Банк</th>
            <th>Платёжная система</th>
            <th>Номер карты</th>
            <th>Держатель</th>
            <th>Срок</th>
          </tr>
        </thead>
        <tbody id="cardsTableBody">
          <tr class="empty-row">
            <td colspan="5">Нет сохранённых карт</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
 
  <script src="script.js"></script>
</body>
</html>
